<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>hns — sign in</title>
<style>body{font:14px/1.5 ui-monospace,monospace;max-width:560px;margin:10vh auto;padding:0 16px}
input,button{font:inherit;padding:6px 8px}pre{background:#f6f6f6;padding:8px;white-space:pre-wrap}</style>
</head>
<body>
<h1>hns</h1>
<p>passkey で登録・ログインします。PRF 対応の認証器なら、秘密はログイン中だけ復号できます。</p>
<p><input id="login" placeholder="login" autocomplete="username"> <button id="register">register</button> <button id="signin">sign in</button></p>
<pre id="status"></pre>
<script type="module">
const PRF_SALT = new TextEncoder().encode("hns-prf-v1");
const toBytes = (value) => {
  const base = value.replace(/-/g, "+").replace(/_/g, "/");
  const binary = atob(base + "=".repeat((4 - (base.length % 4)) % 4));
  return Uint8Array.from(binary, (c) => c.charCodeAt(0));
};
const fromBytes = (buffer) => btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64 = (bytes) => btoa(String.fromCharCode(...new Uint8Array(bytes)));
const unb64 = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
const status = (text) => { document.querySelector("#status").textContent = text; };
const login = () => document.querySelector("#login").value.trim();

async function post(path, body) {
  const response = await fetch(path, { method: "POST", body: JSON.stringify(body) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.error) throw new Error(data.error ?? response.status);
  return data;
}

async function deriveKek(prfOutput) {
  const base = await crypto.subtle.importKey("raw", prfOutput, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0), info: new TextEncoder().encode("hns-dek-wrap") },
    base, { name: "AES-GCM", length: 256 }, false, ["wrapKey", "unwrapKey"],
  );
}

document.querySelector("#register").onclick = async () => {
  try {
    status("registering…");
    const options = await post("/api/passkey/register/options", { login: login() });
    options.challenge = toBytes(options.challenge);
    options.user.id = toBytes(options.user.id);
    for (const credential of options.excludeCredentials ?? []) credential.id = toBytes(credential.id);
    options.extensions = { prf: { eval: { first: PRF_SALT } } };
    const created = await navigator.credentials.create({ publicKey: options });

    let wrapped = {};
    const prf = created.getClientExtensionResults().prf?.results?.first;
    if (prf) {
      const kek = await deriveKek(prf);
      const dek = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const wrappedBytes = await crypto.subtle.wrapKey("raw", dek, kek, { name: "AES-GCM", iv });
      wrapped = { wrappedDek: b64(wrappedBytes), dekIv: b64(iv) };
    }

    const response = {
      id: created.id, type: created.type, rawId: fromBytes(created.rawId),
      response: {
        clientDataJSON: fromBytes(created.response.clientDataJSON),
        attestationObject: fromBytes(created.response.attestationObject),
        transports: created.response.getTransports?.() ?? [],
      },
    };
    await post("/api/passkey/register/verify", { login: login(), response, ...wrapped });
    status(prf ? "registered. sign in." : "registered, but this authenticator has no PRF: user secrets stay unavailable.");
  } catch (error) { status("error: " + error.message); }
};

document.querySelector("#signin").onclick = async () => {
  try {
    status("signing in…");
    const options = await post("/api/passkey/login/options", { login: login() });
    const wrapped = options.wrapped;
    delete options.wrapped;
    options.challenge = toBytes(options.challenge);
    for (const credential of options.allowCredentials ?? []) credential.id = toBytes(credential.id);
    options.extensions = { prf: { eval: { first: PRF_SALT } } };
    const assertion = await navigator.credentials.get({ publicKey: options });

    const response = {
      id: assertion.id, type: assertion.type, rawId: fromBytes(assertion.rawId),
      response: {
        clientDataJSON: fromBytes(assertion.response.clientDataJSON),
        authenticatorData: fromBytes(assertion.response.authenticatorData),
        signature: fromBytes(assertion.response.signature),
        userHandle: assertion.response.userHandle ? fromBytes(assertion.response.userHandle) : undefined,
      },
    };
    await post("/api/passkey/login/verify", { login: login(), response });

    const prf = assertion.getClientExtensionResults().prf?.results?.first;
    if (prf && wrapped) {
      const kek = await deriveKek(prf);
      const dek = await crypto.subtle.unwrapKey(
        "raw", unb64(wrapped.wrappedDek), kek, { name: "AES-GCM", iv: unb64(wrapped.dekIv) },
        { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"],
      );
      const raw = await crypto.subtle.exportKey("raw", dek);
      await post("/api/passkey/unlock", { dek: b64(raw) });
      status("signed in and unlocked.");
    } else {
      status("signed in. secrets are locked (no PRF or no wrapped key).");
    }
    location.href = "/";
  } catch (error) { status("error: " + error.message); }
};
</script>
</body>
</html>
